services:
  unitree_ros:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTALL_COCO: ${INSTALL_COCO:-false}
        INSTALL_CPP_LIDAR: ${INSTALL_CPP_LIDAR:-false}
        INSTALL_FULL_STACK: ${INSTALL_FULL_STACK:-false}
        APT_FORCE_IPV4: ${APT_FORCE_IPV4:-false}
        UBUNTU_PORTS_MIRROR: ${UBUNTU_PORTS_MIRROR:-http://ports.ubuntu.com/ubuntu-ports}
        PIP_NO_INDEX: ${PIP_NO_INDEX:-false}
    environment:
      ROBOT_IP: ${ROBOT_IP:-}
      CONN_TYPE: ${CONN_TYPE:-webrtc}
      WEBRTC_SERVER_HOST: 0.0.0.0
      WEBRTC_SERVER_PORT: ${WEBRTC_SERVER_PORT:-9991}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: 'file:///etc/cyclonedds.xml;<CycloneDDS><Domain><Discovery><Peers><Peer Address="${LAPTOP_TAILSCALE_IP}"/></Peers></Discovery></Domain></CycloneDDS>'
    network_mode: host
    restart: "no"
